<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Xem thử năm ảnh minh họa SVG cho Synaptrail: Git, Docker, MySQL, Security và AI Engineer trên nền sáng và nền tối.">
<meta name="robots" content="noindex">
<title>Duyệt ảnh minh họa | Synaptrail</title>
<link rel="stylesheet" href="../assets/ui.css">
<style>
body{margin:0;font-family:Inter,'Segoe UI',sans-serif} .preview{max-width:1200px;margin:auto;padding:32px 20px} .preview h1{font-size:28px;line-height:1.3;margin:0 0 12px}.preview p{line-height:1.6}.preview h2{font-size:18px;margin:0 0 20px}.panel{padding:24px;border:1px solid #dce8e5;border-radius:16px;margin-top:24px;background:#f7faf9;color:#203a36}.panel.dark{background:#081425;color:#edf4ff;border-color:#2c425c}.samples{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.sample{min-width:0;overflow:hidden;margin:0;border:1px solid #dce8e5;border-radius:12px;background:#fff;color:#203a36;transition:transform .18s}.dark .sample{background:#12243b;color:#edf4ff;border-color:#2c425c}.sample:hover{transform:translateY(-2px)}.sample img{display:block;width:100%;height:auto;aspect-ratio:16/9}.sample figcaption{padding:14px 16px;font-weight:700;font-size:15px}@media(max-width:850px){.samples{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){.samples{grid-template-columns:minmax(0,1fr)}.panel{padding:16px}.preview{padding:24px 16px}}@media(prefers-reduced-motion:reduce){.sample{transition:none}.sample:hover{transform:none}}
</style>
</head>
<body><main class="preview"><h1>Ảnh minh họa Synaptrail</h1><p>Mẫu duyệt phong cách: hình học đơn giản, nền teal–tím, không sử dụng logo sản phẩm. Mỗi ảnh giữ nguyên màu khi đặt trên nền sáng hoặc tối.</p>
<section class="panel"><h2>Nền sáng</h2><div class="samples">
<figure class="sample"><img src="../assets/img/skills/git.svg" alt="" width="320" height="180" loading="lazy"><figcaption>Git</figcaption></figure>
<figure class="sample"><img src="../assets/img/skills/docker.svg" alt="" width="320" height="180" loading="lazy"><figcaption>Docker</figcaption></figure>
<figure class="sample"><img src="../assets/img/skills/mysql.svg" alt="" width="320" height="180" loading="lazy"><figcaption>MySQL</figcaption></figure>
<figure class="sample"><img src="../assets/img/skills/security.svg" alt="" width="320" height="180" loading="lazy"><figcaption>Security</figcaption></figure>
<figure class="sample"><img src="../assets/img/skills/ai-engineer.svg" alt="" width="320" height="180" loading="lazy"><figcaption>AI Engineer</figcaption></figure>
</div></section>
<section class="panel dark"><h2>Nền tối</h2><div class="samples">
<figure class="sample"><img src="../assets/img/skills/git.svg" alt="" width="320" height="180" loading="lazy"><figcaption>Git</figcaption></figure>
<figure class="sample"><img src="../assets/img/skills/docker.svg" alt="" width="320" height="180" loading="lazy"><figcaption>Docker</figcaption></figure>

<figure class="sample"><img src="../assets/img/skills/ai-engineer.svg" alt="" width="320" height="180" loading="lazy"><figcaption>AI Engineer</figcaption></figure>
</div></section></main></body></html>
