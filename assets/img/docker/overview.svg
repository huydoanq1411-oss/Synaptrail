<svg xmlns="http://www.w3.org/2000/svg" width="440" height="720" viewBox="0 0 440 720" role="img" aria-labelledby="title desc"><title id="title">Từ mã nguồn đến container</title><desc id="desc">Build tạo image; registry phân phối image; run tạo container.</desc><rect width="440" height="720" rx="16" fill="#f3f6fb"/><g fill="#17243a" font-family="Arial,sans-serif" text-anchor="middle"><text x="220" y="38" font-size="23" font-weight="700">ĐÓNG GÓI ỨNG DỤNG</text><rect x="24" y="60" width="392" height="94" rx="12" fill="#fff" stroke="#075985" stroke-width="2"/><text x="220" y="97" font-size="22" font-weight="700">Mã nguồn + Dockerfile</text><text x="220" y="127" font-size="19">Ứng dụng và công thức build</text><path d="M220 162v48m-8-10 8 10 8-10" fill="none" stroke="#075985" stroke-width="3"/><text x="315" y="191" font-size="18">1. build</text><rect x="24" y="222" width="392" height="94" rx="12" fill="#e0f2fe" stroke="#075985" stroke-width="2"/><text x="220" y="259" font-size="22" font-weight="700">IMAGE</text><text x="220" y="289" font-size="19">Gói mẫu chỉ đọc</text><path d="M220 324v48m-8-10 8 10 8-10" fill="none" stroke="#075985" stroke-width="3"/><text x="315" y="353" font-size="18">2. push / pull</text><rect x="24" y="384" width="392" height="94" rx="12" fill="#fff" stroke="#075985" stroke-width="2"/><text x="220" y="421" font-size="22" font-weight="700">REGISTRY</text><text x="220" y="451" font-size="19">Lưu và phân phối image</text><path d="M220 486v48m-8-10 8 10 8-10" fill="none" stroke="#075985" stroke-width="3"/><text x="315" y="515" font-size="18">3. run</text><rect x="24" y="546" width="392" height="94" rx="12" fill="#fff" stroke="#075985" stroke-width="2"/><text x="220" y="583" font-size="22" font-weight="700">CONTAINER</text><text x="220" y="613" font-size="19">Tiến trình chạy + lớp ghi riêng</text><text x="220" y="680" font-size="18">Máy cá nhân / Kiểm thử / Máy chủ</text><text x="220" y="706" font-size="17">Cần nền tảng và cấu hình phù hợp</text></g></svg>
